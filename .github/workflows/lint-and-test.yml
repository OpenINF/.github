name: Lint and test

# Also on main, for two reasons: a pull-request-only workflow leaves the
# default branch with no status, so the README badge reports whichever branch
# ran last; and the queue squashes without rebuilding, so nothing else sees
# what actually landed.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint_and_test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out project repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `verify.commits` compares against the base branch, which a
          # single-commit checkout does not contain.
          fetch-depth: 0
          # Otherwise the token stays in .git/config while `pnpm install` and
          # the linters run. Nothing downstream needs it: no step pushes, and
          # no dependency is git-hosted.
          persist-credentials: false
      - name: Set up Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # engineStrict plus an exact engines.node means the runner's own Node
          # is refused. Read rather than repeated.
          node-version-file: 'package.json'
      - name: Install
        run: |
          # No corepack: node is unbundling it, and pnpm reads
          # `packageManager` and fetches that version itself. Installing the
          # named one rather than the newest saves fetching pnpm twice.
          npm install --global "pnpm@$(node -p "require('./package.json').packageManager.replace('pnpm@','').split('+')[0]")"
          pnpm --version
          pnpm install
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      # No build step: there is nothing to build. The checks read the sources.

      # Everything, on every pull request, rather than a per-language subset
      # chosen by which files changed.
      #
      # The subset was chosen by a paths filter, and the tasks that belong to
      # no language -- spelling, filenames, file modes, EditorConfig, the unit
      # tests -- sat behind the same gate as the ones that do. A pull request
      # touching only Markdown skipped all five, so a misspelling could land
      # green and turn main red on the push that followed it, which is the one
      # place nothing is watching.
      #
      # Filtering bought six seconds: an 18-second run against a 24-second one,
      # both of them mostly checkout, node and install. That is not worth a
      # class of change that passes review and breaks the branch it lands on.
      - name: Test
        # verify.validForEC fetches the editorconfig-checker binary from the
        # GitHub API on first use, and node_modules is new on every run here.
        # Unauthenticated that is 60 requests an hour shared with every other
        # job leaving this address, which is a job failing for no reason of
        # its own. The wrapper reads GITHUB_TOKEN and the runner is given one.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nps test
