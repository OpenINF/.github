version = 1
exclude_patterns = [
  "doc/_site/**",
  "lib/**",
  "vendor/**",
  "pnpm-lock.yaml",
]

[[analyzers]]
name = "test-coverage"
enabled = false

[[analyzers]]
name = "shell"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "javascript"
enabled = true

[[analyzers]]
name = "docker"
enabled = true

[analyzers.meta]
dockerfile_paths = [".devcontainer/Dockerfile"]

[[transformers]]
name = "prettier"
enabled = false
